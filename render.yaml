databases:
  - name: video-clone-db
    plan: basic-256mb
    databaseName: clone
    user: clone

services:
  - type: web
    name: video-clone
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    numInstances: 1
    healthCheckPath: /api/waitpoints/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: video-clone-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: VIDEO_PROVIDER
        value: kie
      - key: KIE_API_KEY
        sync: false
      - key: REVANA_API_KEY
        sync: false
      - key: SUME_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SURPLUS_API_KEY
        sync: false
