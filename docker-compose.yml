# Local Postgres + S3 (SeaweedFS) for development, plus optional `--profile full` app container.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clone}
      POSTGRES_DB: ${POSTGRES_DB:-clone}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clone} -d ${POSTGRES_DB:-clone}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible storage; with no identities configured it accepts any key.
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3:/data

  # Creates the bucket once S3 is up.
  s3-bucket:
    image: amazon/aws-cli
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clone}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clone-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3api head-bucket --bucket ${S3_BUCKET:-clone-media} 2>/dev/null
      || aws --endpoint-url http://s3:8333 s3 mb s3://${S3_BUCKET:-clone-media}; do sleep 2; done"

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clone}:${POSTGRES_PASSWORD:-clone}@postgres:5432/${POSTGRES_DB:-clone}
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://s3:8333}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clone}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clone-secret}
      S3_BUCKET: ${S3_BUCKET:-clone-media}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      PREFLIGHT_ALLOW_LOCAL_URLS: ${PREFLIGHT_ALLOW_LOCAL_URLS:-true}

volumes:
  postgres:
  s3:
