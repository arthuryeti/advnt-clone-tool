# Local Postgres + S3 (SeaweedFS) for development.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: clone
      POSTGRES_PASSWORD: clone
      POSTGRES_DB: clone
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  # S3-compatible storage; with no identities configured it accepts any key.
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3:/data

  # Creates the bucket once S3 is up.
  s3-bucket:
    image: amazon/aws-cli
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: clone
      AWS_SECRET_ACCESS_KEY: clone-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3api head-bucket --bucket clone-media 2>/dev/null
      || aws --endpoint-url http://s3:8333 s3 mb s3://clone-media; do sleep 2; done"

volumes:
  postgres:
  s3:
