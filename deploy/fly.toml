# Fly.io template for Video Clone.
# Copy or deploy with:
#   fly launch --copy-config --config deploy/fly.toml --no-deploy
#   fly postgres create ... && fly secrets set DATABASE_URL=... SITE_URL=... S3_* GEMINI_API_KEY=... FAL_API_KEY=...
#   fly deploy --config deploy/fly.toml --dockerfile Dockerfile

app = "video-clone"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  S3_REGION = "auto"
  VIDEO_PROVIDER = "kie"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/waitpoints/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
